<body>
  <header class="studio-hud" aria-label="Studio controls">
    <button type="button" class="hud-brand" id="brand-home" title="Return to iPod root menu">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Mridul Vijay</span>
    </button>

    <div class="hud-actions">
      <div class="music-pill" id="music-pill" data-playing="false" data-loaded="false">
        <button type="button" class="pill-btn pill-play" id="music-toggle" aria-label="Play studio ambient music">
          <span class="play-glyph" aria-hidden="true">
            <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor"><path d="M2.5 1.75v8.5L10 6z"/></svg>
          </span>
          <span class="eq-bars" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
        </button>
        <button type="button" class="pill-btn pill-track" id="music-track" title="Open Now Playing on iPod">
          <span class="pill-title" id="music-title">Studio Ambient</span>
          <span class="pill-artist" id="music-artist">Play</span>
        </button>
        <button type="button" class="pill-btn pill-next" id="music-next" aria-label="Next track" title="Next track" hidden>
          <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M2 2.2v7.6L7.6 6 2 2.2zm6.4 0H10v7.6H8.4V2.2z"/></svg>
        </button>
      </div>

      <button type="button" class="hud-notes-btn" id="notes-toggle" aria-expanded="false" aria-controls="notes-sheet">
        Notes
      </button>
    </div>
  </header>

  <main id="stage">
    <h1 class="sr-only">Mridul Vijay — interactive 2004 iPod portfolio</h1>
    <div class="set" id="ipod-set">
      <div class="lcd-spill" id="lcd-spill" aria-hidden="true"></div>
      <div class="chassis-rig" id="chassis-rig">
        <web-music-ipod id="ipod" aria-label="Portfolio navigation"></web-music-ipod>
        <div class="chassis-sheen" aria-hidden="true"></div>
      </div>
      <div class="floor" aria-hidden="true"><div class="occlusion"></div></div>
    </div>
    <p class="studio-hint" id="studio-hint" aria-live="polite">
      Click a row, scroll, or spin the wheel<span class="hint-keys"> &nbsp;&middot;&nbsp; <kbd>&uarr;</kbd><kbd>&darr;</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd></span>
    </p>
  </main>
