  <header class="studio-hud" aria-label="Audio controls">
    <div class="ipod-remote" id="music-pill" data-playing="false" data-loaded="false">
      <button type="button" class="remote-key remote-mute" id="music-toggle" aria-label="Unmute and play music" aria-pressed="false" title="Unmute / Mute">
        <span class="mute-glyph" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 6.2H5l3.2-2.7v9L5 9.8H2.5z" fill="currentColor" stroke="none"/>
            <path d="M11 6l3 4M14 6l-3 4"/>
          </svg>
        </span>
        <span class="sound-glyph" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 6.2H5l3.2-2.7v9L5 9.8H2.5z" fill="currentColor" stroke="none"/>
            <path d="M10.7 5.8a3.2 3.2 0 0 1 0 4.4"/>
            <path d="M12.6 4.1a5.6 5.6 0 0 1 0 7.8"/>
          </svg>
        </span>
      </button>

      <button type="button" class="remote-lcd" id="music-track" title="Open Now Playing on iPod">
        <span class="lcd-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="lcd-title" id="music-title">Sound Off</span>
        <span class="lcd-artist" id="music-artist">Dear Prudence</span>
      </button>

      <button type="button" class="remote-key remote-next" id="music-next" aria-label="Next song" title="Next song" hidden>
        <svg viewBox="0 0 14 14" width="11" height="11" fill="currentColor" aria-hidden="true">
          <path d="M2.2 3.1v7.8L8.2 7 2.2 3.1zm6.8 0h1.9v7.8H9V3.1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="stage">
